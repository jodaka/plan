[package]
name = "plan"
# Kept in sync with package.json by scripts/release.ts — do not edit by hand.
version = "0.4.0"
description = "Lightweight floor plan editor"
authors = ["you"]
edition = "2021"

[lib]
name = "plan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
