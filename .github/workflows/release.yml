name: Release

# One-click releases:
#   1. Actions tab → Release → Run workflow → pick the bump (patch / minor / major).
#      The "version" job runs scripts/release.ts: it bumps package.json (+ the
#      version.ts / Cargo.toml / Cargo.lock mirrors), commits
#      "chore: release vX.Y.Z", creates the vX.Y.Z tag and pushes both.
#      Re-running an already-released version is refused (the tag exists) —
#      bump further instead.
#   2. The "build" matrix checks out the tag and tauri-action attaches the native
#      bundles (dmg / msi+nsis / deb+rpm+AppImage) to a draft GitHub release for it.
#
# Re-running a failed build for an existing version: push the tag again
#   (git push origin vX.Y.Z) — a tag push skips the version job and goes
#   straight to the build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump to apply'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write # version job pushes the release commit + tag; build uploads release assets

# Never run two release flows at once (double click, dispatch + tag push).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump version, commit, tag and push
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: bun scripts/release.ts "$BUMP"

  build:
    needs: version
    # After a successful bump (dispatch), or directly on a tag push (the version
    # job is skipped there).
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
          # macOS x86_64 (Intel)
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
          # Windows (NSIS installer + MSI)
          - platform: windows-latest
            rust-target: ''
          # Linux (deb + rpm + AppImage)
          - platform: ubuntu-22.04
            rust-target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (webkit2gtk etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ needs.version.outputs.tag || github.ref_name }}
          releaseName: 'Plan ${{ needs.version.outputs.tag || github.ref_name }}'
          releaseBody: 'Native desktop builds of Plan.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.rust-target != '' && format('--target {0}', matrix.rust-target) || '' }}
